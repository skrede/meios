name: Sanitizers

on:
  push:
    branches: [master, develop, 'milestone/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  # Advisory sanitizer job: asan/ubsan is where the value is, tsan is kept for
  # the record on a single-threaded library. Flags are injected globally at
  # configure via CMAKE_CXX_FLAGS/CMAKE_C_FLAGS so instrumentation reaches
  # meios_core and the in-tree pugixml (FETCH_DEPS=ON builds it from source under
  # the same flags), not just the harness translation units. continue-on-error
  # keeps every finding advisory; promotion to a required gate is a deliberate,
  # visible deferral recorded here in prose.
  sanitize:
    name: sanitize (${{ matrix.label }})
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          - label: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g"

    env:
      CC: clang-18
      CXX: clang++-18
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}"

      # The correctness constraint: the instrumentation must reach the library,
      # not only the tests. Prove it against the compile database before building
      # by asserting the compiled library TU carries -fsanitize; a job that fails
      # here is coverage-blind and its green result would mean nothing.
      - name: Assert the library TU carries sanitizer instrumentation
        run: |
          if grep -F 'lib/meios-core/src/meios/version.cpp' build/compile_commands.json | grep -q -- '-fsanitize'; then
            echo "confirmed: lib/meios-core/src/meios/version.cpp compiled with -fsanitize"
          else
            echo "FAIL: lib/meios-core/src/meios/version.cpp is not instrumented in the compile database" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

      # The library is single-threaded: no concurrency primitives exist under
      # lib/ or tools/, so thread sanitizer has nothing to find. The grep is the
      # falsifier — if it ever finds one, this assumption is stale and the step
      # fails so the tsan cell can be reconsidered.
      - name: Record tsan scope
        if: matrix.label == 'tsan'
        run: |
          pattern='std::thread|std::mutex|std::atomic|std::async|std::jthread|<thread>|<mutex>|<atomic>|<future>|condition_variable'
          hits=$(grep -rIE "$pattern" lib tools | wc -l)
          if [ "$hits" -ne 0 ]; then
            echo "Unexpected concurrency primitives found ($hits); the tsan-finds-nothing assumption is stale:" >&2
            grep -rInE "$pattern" lib tools >&2
            exit 1
          fi
          echo "Zero concurrency primitives under lib/ and tools/: thread sanitizer finds nothing on this single-threaded library."
          echo "This tsan cell is a deliberate, visible, auditable deferral kept for the record, not credited with coverage it does not provide."

  # Advisory fuzz job: clang only, because the CMake guard builds zero harnesses
  # under gcc and would leave a gcc cell green while fuzzing nothing. Global
  # fuzzer-no-link,address instrumentation reaches meios_core and the in-tree
  # pugixml (the harness itself pulls in libFuzzer's main via its own link
  # driver); each harness is bounded so an unbounded libFuzzer run cannot hang to
  # the job timeout, which continue-on-error would not interrupt.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    continue-on-error: true

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DMEIOS_BUILD_FUZZERS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -g" \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address -fno-omit-frame-pointer -g"

      # The "fuzzes nothing" defect lives here: a coverage-blind library would run
      # green forever. Prove the library, not just the harness, is instrumented by
      # asserting the compiled library TU carries -fsanitize in the compile
      # database before any fuzzing starts.
      - name: Assert the library TU carries sanitizer instrumentation
        run: |
          if grep -F 'lib/meios-core/src/meios/version.cpp' build/compile_commands.json | grep -q -- '-fsanitize'; then
            echo "confirmed: lib/meios-core/src/meios/version.cpp compiled with -fsanitize"
          else
            echo "FAIL: lib/meios-core/src/meios/version.cpp is not instrumented in the compile database" >&2
            exit 1
          fi

      - name: Build
        run: cmake --build build

      # The fuzz CMakeLists globs *_fuzz.cpp, so a deleted harness silently drops
      # the count. Assert all four by exact name so a missing binary fails the job
      # instead of quietly fuzzing fewer entry points.
      - name: Assert all four fuzz harnesses were built
        run: |
          for n in bundle_writer_fuzz evaluator_fuzz structural_fuzz urdf_reader_fuzz; do
            matches=$(find build -type f -name "$n" -perm -u+x)
            count=$(printf '%s' "$matches" | grep -c .)
            if [ "$count" -ne 1 ]; then
              echo "FAIL: expected exactly one $n executable, found $count" >&2
              exit 1
            fi
            echo "found $n: $matches"
          done

      # Each harness gets a fresh writable work corpus as its first positional arg
      # and a read-only seed directory as the second. evaluator_fuzz consumes bare
      # expression strings so it seeds from the dedicated corpus; the other three
      # consume whole documents so they seed from the URDF/xacro fixtures, which
      # libFuzzer reads recursively. -max_total_time=60 bounds every harness so an
      # unbounded run cannot hang the job.
      - name: Fuzz each harness (advisory, 60s each)
        run: |
          find_bin() { find build -type f -name "$1" -perm -u+x | head -n1; }
          mkdir -p work/bundle_writer work/evaluator work/structural work/urdf_reader

          "$(find_bin evaluator_fuzz)"     work/evaluator     tests/fuzz/corpus/evaluator -max_total_time=60
          "$(find_bin urdf_reader_fuzz)"   work/urdf_reader   tests/fixtures/urdf         -max_total_time=60
          "$(find_bin bundle_writer_fuzz)" work/bundle_writer tests/fixtures/urdf         -max_total_time=60
          "$(find_bin structural_fuzz)"    work/structural    tests/fixtures/urdf         -max_total_time=60
