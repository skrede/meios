name: Linux

on:
  push:
    branches: [master, develop, 'milestone/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  header-guards:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check header guard uniqueness and format
        run: |
          guards=$(grep -rh '^#ifndef HPP_GUARD_' lib --include='*.h' | awk '{print $2}')
          dups=$(printf '%s\n' "$guards" | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate header guards:"
            echo "$dups"
            exit 1
          fi
          bad=$(printf '%s\n' "$guards" | grep -vE '^HPP_GUARD_MEIOS[A-Z0-9_]*_H$' || true)
          if [ -n "$bad" ]; then
            echo "Header guards not matching HPP_GUARD_MEIOS[A-Z0-9_]*_H:"
            echo "$bad"
            exit 1
          fi
          echo "Checked $(printf '%s\n' "$guards" | wc -l) header guards: all unique and well-formed."

  file-size:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check header size ceiling
        run: |
          status=0
          while IFS= read -r header; do
            lines=$(wc -l < "$header")
            if [ "$lines" -gt 200 ] && ! grep -qF "$header" EXCEPTIONS.md; then
              echo "OVER CEILING ($lines lines, limit 200): $header"
              status=1
            fi
          done < <(find lib -name '*.h')
          if [ "$status" -ne 0 ]; then
            echo "Headers over the 200-line ceiling must be registered in EXCEPTIONS.md."
            exit 1
          fi
          echo "All lib headers are within the 200-line ceiling (or registered)."

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            gcov_executable: gcov-14
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            gcov_executable: "llvm-cov-18 gcov"

    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      # meios::core links pugixml PRIVATE; the config-package resolves it via
      # find_dependency(pugixml 1.16), so a >= 1.16 pugixml must be discoverable.
      # Runner package managers ship older, so build the pinned release.
      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # meios::ros is the one enrichment that defaults on, so this job turns it off by
      # hand: it is the leg that proves core builds and passes with no enrichment
      # compiled in, and it is where coverage is measured.
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_COVERAGE=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_ROS_PACKAGE_SUPPORT=OFF \
            -DMEIOS_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      # ctest reports success when a -R filter selects nothing, so each scratch stem is
      # asserted to register before it runs; a stem that quietly stopped registering would
      # otherwise pass as a green filtered run.
      - name: Focus scratch setup tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_setup\.'"
          registered=$(ctest -N -R '^scratch_setup\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_setup registered no tests"
            exit 1
          fi
          echo "scratch_setup registered $registered test(s)"
          ctest -R '^scratch_setup\.' --output-on-failure --no-tests=error

      - name: Focus scratch publish tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_publish\.'"
          registered=$(ctest -N -R '^scratch_publish\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_publish registered no tests"
            exit 1
          fi
          echo "scratch_publish registered $registered test(s)"
          ctest -R '^scratch_publish\.' --output-on-failure --no-tests=error

      # Which branch this case takes is decided by the platform, so a run that only reports failures
      # records nothing about which one it took. Verbose, so the branch is in the transcript.
      - name: Record the held-open replacement branch
        run: |
          cd build
          selector='held open'
          echo "ctest -N -R '$selector'"
          registered=$(ctest -N -R "$selector" | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "no held-open replacement case discovered"
            exit 1
          fi
          echo "held-open replacement discovered $registered case(s)"
          ctest -V -R "$selector" --no-tests=error

      - name: Focus scratch replace tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_replace\.'"
          registered=$(ctest -N -R '^scratch_replace\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_replace registered no tests"
            exit 1
          fi
          echo "scratch_replace registered $registered test(s)"
          ctest -R '^scratch_replace\.' --output-on-failure --no-tests=error

      - name: Focus scratch alias tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_alias\.'"
          registered=$(ctest -N -R '^scratch_alias\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_alias registered no tests"
            exit 1
          fi
          echo "scratch_alias registered $registered test(s)"
          ctest -R '^scratch_alias\.' --output-on-failure --no-tests=error

      # The next two stems register only where symbolic links exist, so the Windows build job
      # carries no step for either: a step that discovered nothing would fail it by design.
      - name: Focus scratch denial tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_denial\.'"
          registered=$(ctest -N -R '^scratch_denial\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_denial registered no tests"
            exit 1
          fi
          echo "scratch_denial registered $registered test(s)"
          ctest -R '^scratch_denial\.' --output-on-failure --no-tests=error

      - name: Focus scratch symlinked tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_symlinked\.'"
          registered=$(ctest -N -R '^scratch_symlinked\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_symlinked registered no tests"
            exit 1
          fi
          echo "scratch_symlinked registered $registered test(s)"
          ctest -R '^scratch_symlinked\.' --output-on-failure --no-tests=error

      # The next three replace the global allocation functions, so their registration is decided by
      # a build-time predicate rather than by the source alone. A stem that predicate drops still
      # leaves a green suite behind it, which is how a link failure survived a run once already.
      - name: Focus scratch exhaustion tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_exhaustion\.'"
          registered=$(ctest -N -R '^scratch_exhaustion\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_exhaustion registered no tests"
            exit 1
          fi
          echo "scratch_exhaustion registered $registered test(s)"
          ctest -R '^scratch_exhaustion\.' --output-on-failure --no-tests=error

      - name: Focus scratch teardown tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_teardown\.'"
          registered=$(ctest -N -R '^scratch_teardown\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_teardown registered no tests"
            exit 1
          fi
          echo "scratch_teardown registered $registered test(s)"
          ctest -R '^scratch_teardown\.' --output-on-failure --no-tests=error

      - name: Focus scratch foreign tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_foreign\.'"
          registered=$(ctest -N -R '^scratch_foreign\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_foreign registered no tests"
            exit 1
          fi
          echo "scratch_foreign registered $registered test(s)"
          ctest -R '^scratch_foreign\.' --output-on-failure --no-tests=error

      # Verbose rather than --output-on-failure: this stem decides at runtime whether its volume
      # folds, and here it is expected to skip. The transcript is the only place that reads as a
      # deliberate skip rather than as a stem that quietly stopped registering.
      - name: Focus scratch case-folding tests
        run: |
          cd build
          echo "ctest -N -R '^scratch_case_fold\.'"
          registered=$(ctest -N -R '^scratch_case_fold\.' | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "scratch_case_fold registered no tests"
            exit 1
          fi
          echo "scratch_case_fold registered $registered test(s)"
          ctest -V -R '^scratch_case_fold\.' --no-tests=error

      - name: Test
        run: cd build && ctest --output-on-failure

      # Filter to meios sources under lib/ (compiled TUs + headers). The compiled
      # TU lib/meios-core/src/meios/version.cpp lives under src/, so a headers-only
      # glob would yield an empty report.
      - name: Generate coverage
        run: |
          gcovr build \
            --root . \
            --gcov-executable "${{ matrix.gcov_executable }}" \
            --filter 'lib/.*/(include|src)/meios/' \
            --gcov-ignore-errors=source_not_found \
            --cobertura coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DMEIOS_CMAKE_FETCH_DEPS=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer project
        run: |
          cmake tests/integration/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test

      - name: Build and run the installed resource consumer
        run: |
          cmake examples/install_consumer -B build-resource-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/resource-consumer-install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-resource-consumer
          cmake --install build-resource-consumer
          "${{ github.workspace }}/resource-consumer-install/bin/install_consumer"

  enrichments:
    runs-on: ubuntu-24.04
    name: enrichments (scanners + archive-zip + ros)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # scan-gltf's nlohmann/json is header-only and archive-zip's miniz is a
      # single-file C library, both FetchContent-acquired, so no extra install
      # step is needed. ros depends only on the already-installed pugixml.
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_SCAN_OBJ=ON \
            -DMEIOS_BUILD_SCAN_COLLADA=ON \
            -DMEIOS_BUILD_SCAN_STL=ON \
            -DMEIOS_BUILD_SCAN_GLTF=ON \
            -DMEIOS_BUILD_ARCHIVE_ZIP=ON \
            -DMEIOS_ROS_PACKAGE_SUPPORT=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  eval-python:
    runs-on: ubuntu-24.04
    name: eval-python (Python found + absent)

    steps:
      - uses: actions/checkout@v4

      # python3-yaml comes from the image's own repositories and is built for the
      # same interpreter python3-dev configures against, so the resource helper's
      # tests run instead of skipping on a missing module.
      - name: Install Python development headers and the yaml module
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-yaml

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # eval-python forces install off (its pybind11-embed link edge cannot be
      # re-resolved from an installed tree), so it never joins an install-consumer
      # leg. This job exercises only build+test, never install.
      #
      # MEIOS_BUILD_TOOLS is on here and nowhere else alongside the enrichment:
      # the build-time flatten that really executes Python needs the CLI and the
      # python backend in one tree, and this is the job that requires the
      # enrichment rather than merely offering it.
      - name: Configure (Python found)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build-py -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_BUILD_TOOLS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_EVAL_PYTHON=ON \
            -DMEIOS_REQUIRE_EVAL_PYTHON=ON

      - name: Build (Python found)
        run: cmake --build build-py

      - name: Test (Python found)
        run: cd build-py && ctest --output-on-failure

      # ctest reports success when a -R filter selects nothing, so the leg that
      # requires the enrichment asserts the abuse suite exists before running it;
      # otherwise a vanished test stem passes as a green filtered run.
      - name: Assert the abuse suite ran (Python found)
        run: |
          cd build-py
          registered=$(ctest -N -R eval_python_abuse | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "eval_python_abuse registered no tests"
            exit 1
          fi
          echo "eval_python_abuse registered $registered test(s)"
          ctest -R eval_python_abuse --output-on-failure

      # The build-time flatten that really runs Python registers only where the
      # CLI carries the backend, so it is asserted present for the same reason:
      # a case that quietly stopped registering would pass as a green filtered
      # run and this job is the only one that can run it at all.
      - name: Assert the build-time python flatten ran (Python found)
        run: |
          cd build-py
          registered=$(ctest -N -R cmake_flatten_eval_python_live | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "cmake_flatten_eval_python_live registered no tests"
            exit 1
          fi
          echo "cmake_flatten_eval_python_live registered $registered test(s)"
          ctest -R cmake_flatten_eval_python_live --output-on-failure

      # Python absent: the eval-python target must be skipped and the always-on
      # core-evaluator eval_policy tests must stay green.
      - name: Configure (Python absent)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build-nopy -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_EVAL_PYTHON=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE

      - name: Build (Python absent)
        run: cmake --build build-nopy

      - name: Test (Python absent)
        run: cd build-nopy && ctest --output-on-failure

  examples:
    runs-on: ubuntu-24.04
    name: examples (MEIOS_BUILD_EXAMPLES)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # The examples cell builds examples/ with all enrichments OFF: the flagship
      # (core+urdf only) must compile and every enrichment example must gate itself
      # out. All enrichments stay OFF.
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

  docs:
    runs-on: ubuntu-24.04
    name: docs (MEIOS_BUILD_DOCS compile-gate)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # The gate compiles the documented snippets against the build-tree
      # meios::urdf target with every enrichment OFF, so it exercises the core
      # consumer surface and FATALs at configure on a zero or malformed snippet.
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_DOCS=ON

      - name: Build
        run: cmake --build build --target doc_snippets

  tools:
    runs-on: ubuntu-24.04
    name: tools (MEIOS_BUILD_TOOLS + CLI unit tests)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # MEIOS_BUILD_TOOLS compiles the meios CLI; MEIOS_BUILD_TESTS is required
      # for the if(TARGET meios_cli) unit tests to register (they skip silently
      # in every no-TOOLS build).
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_TOOLS=ON \
            -DMEIOS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  property-tests:
    runs-on: ubuntu-24.04
    name: property-tests (RapidCheck xacro_eval_prop)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # MEIOS_BUILD_PROPERTY_TESTS alone declares the RapidCheck fetch and the
      # xacro_eval_prop target (it does not need MEIOS_BUILD_TESTS).
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_PROPERTY_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  corpus:
    runs-on: ubuntu-24.04
    name: corpus (pinned known-good + known-faulty pair, every named document)

    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # The always-on tier fetches one small pinned known-good description and
      # wires the in-repo crafted known-faulty fixture; it is blocking so a fetch
      # or parse regression turns the PR red. Breadth is on here too: it names
      # every top-level document that same fetch already carries, so a rule that
      # refuses a real robot description turns the PR red without a second
      # network dependency entering a blocking path. The evaluator-requiring
      # documents stay in the scheduled run, because building that backend forces
      # the install option off and the install-consumer legs need it.
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_FETCH_CORPUS=ON \
            -DMEIOS_CORPUS_BREADTH=ON

      - name: Build
        run: cmake --build build

      # ctest reports success when a -R filter selects nothing, so the selection is
      # asserted non-empty before it runs; otherwise a gate that gates nothing
      # passes as a green filtered run. -V puts the loaded/skipped document count
      # in the log, so the leg states its own coverage.
      - name: Test
        run: |
          cd build
          registered=$(ctest -N -R urdf_corpus | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "urdf_corpus registered no tests"
            exit 1
          fi
          echo "urdf_corpus registered $registered test(s)"
          ctest -R urdf_corpus -V

      # Byte-identical flatten check against the committed baseline, over the same
      # always-on pinned known-good description. Blocking, so any drift in flatten
      # output turns the PR red.
      - name: Test flatten byte identity
        run: cd build && ctest -R flatten_instrument --output-on-failure
