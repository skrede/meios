name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  # The expression-valued upstream is fetched from a third-party host every run and
  # needs a backend that only Linux builds carry, so it must never gate a PR. This
  # job runs on a schedule only and is continue-on-error. The documents the blocking
  # leg already covers are not repeated here for their own sake; what this job adds
  # is the description that only expands through the Python evaluator.
  corpus-breadth:
    runs-on: ubuntu-24.04
    continue-on-error: true
    name: corpus breadth (expression-valued documents, non-blocking)

    steps:
      - uses: actions/checkout@v4

      # python3-yaml comes from the image's own repositories and is built for the
      # same interpreter python3-dev configures against; the description loads its
      # physical parameters out of yaml, so both are needed.
      - name: Install Python development headers and the yaml module
        run: sudo apt-get update && sudo apt-get install -y python3-dev python3-yaml

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/deps" \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_BUILD_EVAL_PYTHON=ON \
            -DMEIOS_REQUIRE_EVAL_PYTHON=ON \
            -DMEIOS_FETCH_CORPUS=ON \
            -DMEIOS_CORPUS_BREADTH=ON \
            -DMEIOS_CORPUS_EXPRESSION_DOCUMENTS=ON

      - name: Build
        run: cmake --build build

      # -V so the loaded/skipped document count reaches the log: an evaluator that
      # failed to build would otherwise leave this leg silently covering less than
      # its name claims. The selection is asserted non-empty first, because a filter
      # that matches nothing reports the same success as a run that covered the corpus.
      - name: Test
        continue-on-error: true
        run: |
          cd build
          registered=$(ctest -N -R urdf_corpus | grep -c 'Test *#' || true)
          if [ "$registered" -eq 0 ]; then
            echo "urdf_corpus registered no tests"
            exit 1
          fi
          echo "urdf_corpus registered $registered test(s)"
          ctest -R urdf_corpus -V --no-tests=error
