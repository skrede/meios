name: Windows

on:
  push:
    branches: [master, develop, 'milestone/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The config-package resolves pugixml via find_dependency(pugixml 1.16);
      # vcpkg ships an older release, so build the pinned one.
      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_BUILD_TESTS=ON `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Focus text reader tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^text_reader\.' -C Release"
          $discovery = & ctest -N -R '^text_reader\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No text reader tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^text_reader\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^text_reader\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus operation failure tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^operation_failure\.' -C Release"
          $discovery = & ctest -N -R '^operation_failure\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No operation failure tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^operation_failure\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^operation_failure\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus YAML acquisition tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^yaml_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^yaml_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No YAML acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^yaml_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^yaml_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus source lookup tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^io_source_lookup\.' -C Release"
          $discovery = & ctest -N -R '^io_source_lookup\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No source lookup tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^io_source_lookup\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^io_source_lookup\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus load acquisition tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^load_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^load_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No load acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^load_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^load_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scratch setup tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_setup\.' -C Release"
          $discovery = & ctest -N -R '^scratch_setup\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch setup tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_setup\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_setup\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scratch publish tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_publish\.' -C Release"
          $discovery = & ctest -N -R '^scratch_publish\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch publish tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_publish\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_publish\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Which branch a rename over a held-open destination takes is a native fact this project has
      # measured on POSIX only. The case prints the branch it saw, and only a verbose run keeps that
      # print when the case passes, so this step exists to retain the transcript rather than to check
      # anything the step above does not already check.
      - name: Record the held-open replacement branch
        working-directory: build
        shell: pwsh
        run: |
          $selector = 'held open'
          Write-Host "ctest -N -R '$selector' -C Release"
          $discovery = & ctest -N -R $selector -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No held-open replacement case discovered" }
          Write-Host "ctest -V --no-tests=error -R '$selector' -C Release --timeout 60"
          & ctest -V --no-tests=error -R $selector -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scratch replace tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_replace\.' -C Release"
          $discovery = & ctest -N -R '^scratch_replace\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch replace tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_replace\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_replace\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The scratch denial and symlinked stems register only where symbolic links exist, so this
      # job focuses neither: a step that discovered nothing would fail it by design.
      - name: Focus scratch alias tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_alias\.' -C Release"
          $discovery = & ctest -N -R '^scratch_alias\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch alias tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_alias\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_alias\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The first three replace the global allocation functions and the fourth carries a
      # volume-sensitive guard, so all four have a registration decided by something other than the
      # source. A stem that condition drops leaves a green suite behind it.
      - name: Focus scratch exhaustion tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_exhaustion\.' -C Release"
          $discovery = & ctest -N -R '^scratch_exhaustion\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch exhaustion tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_exhaustion\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_exhaustion\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scratch teardown tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_teardown\.' -C Release"
          $discovery = & ctest -N -R '^scratch_teardown\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch teardown tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_teardown\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_teardown\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scratch foreign tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_foreign\.' -C Release"
          $discovery = & ctest -N -R '^scratch_foreign\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch foreign tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scratch_foreign\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scratch_foreign\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Verbose rather than --output-on-failure: this stem's whole value is that its guard fired on a
      # volume that folds, and a passing case's transcript is the only place that is visible.
      - name: Focus scratch case-folding tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scratch_case_fold\.' -C Release"
          $discovery = & ctest -N -R '^scratch_case_fold\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scratch case-folding tests discovered" }
          Write-Host "ctest -V --no-tests=error -R '^scratch_case_fold\.' -C Release --timeout 60"
          & ctest -V --no-tests=error -R '^scratch_case_fold\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60

  install-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DMEIOS_CMAKE_FETCH_DEPS=OFF

      - name: Build and install
        run: |
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Build consumer
        run: |
          cmake tests/integration/consumer -B build-consumer -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps"
          cmake --build build-consumer --config Release

      - name: Run consumer test
        run: build-consumer/Release/integration_test.exe

      - name: Build and run the installed resource consumer
        run: |
          cmake examples/install_consumer -B build-resource-consumer -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/resource-consumer-install"
          cmake --build build-resource-consumer --config Release
          cmake --install build-resource-consumer --config Release
          & "${{ github.workspace }}/resource-consumer-install/bin/install_consumer.exe"

  enrichments:
    runs-on: windows-2022
    name: enrichments (scanners + archive-zip + ros)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_BUILD_TESTS=ON `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_SCAN_OBJ_SUPPORT=ON `
            -DMEIOS_BUILD_SCAN_COLLADA=ON `
            -DMEIOS_BUILD_SCAN_STL=ON `
            -DMEIOS_BUILD_SCAN_GLTF=ON `
            -DMEIOS_BUILD_ARCHIVE_ZIP=ON `
            -DMEIOS_BUILD_EXAMPLES=ON `
            -DMEIOS_ROS_PACKAGE_SUPPORT=ON

      - name: Build
        run: cmake --build build --config Release

      # This is the only cell that compiles the enrichment-gated examples at all, and a -R filter
      # selecting nothing exits 0, so the corpus is asserted to register before it runs.
      - name: Run examples
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^example_' -C Release"
          $discovery = & ctest -N -R '^example_' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No examples discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^example_' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^example_' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus ROS source tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^ros_source\.' -C Release"
          $discovery = & ctest -N -R '^ros_source\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No ROS source tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^ros_source\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^ros_source\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The scanner stems register only where their module option is on, so a stem that
      # quietly stopped registering would pass here as a green filtered run. Each is
      # asserted to have discovered tests before its result is trusted.
      - name: Focus scan_obj tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scan_obj\.' -C Release"
          $discovery = & ctest -N -R '^scan_obj\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scan_obj tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scan_obj\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scan_obj\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scan_collada tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scan_collada\.' -C Release"
          $discovery = & ctest -N -R '^scan_collada\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scan_collada tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scan_collada\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scan_collada\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus scan_gltf tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^scan_gltf\.' -C Release"
          $discovery = & ctest -N -R '^scan_gltf\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No scan_gltf tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^scan_gltf\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^scan_gltf\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --no-tests=error --timeout 60

  examples:
    runs-on: windows-2022
    name: examples (MEIOS_BUILD_EXAMPLES)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # The examples cell builds examples/ with all enrichments OFF: the flagship
      # (core+urdf only) must compile and every enrichment example must gate itself
      # out. All enrichments stay OFF.
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      # A -R filter selecting nothing exits 0, so the corpus is asserted to register before it
      # runs; here that proves the ungated examples survive an all-enrichments-OFF configure.
      - name: Run examples
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^example_' -C Release"
          $discovery = & ctest -N -R '^example_' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No examples discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^example_' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^example_' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  docs:
    runs-on: windows-2022
    name: docs (MEIOS_BUILD_DOCS compile-gate)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # The gate compiles the documented snippets against the build-tree
      # meios::urdf target with every enrichment OFF, so it exercises the core
      # consumer surface and FATALs at configure on a zero or malformed snippet.
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_DOCS=ON

      - name: Build
        run: cmake --build build --config Release --target doc_snippets

  tools:
    runs-on: windows-2022
    name: tools (MEIOS_BUILD_TOOLS + CLI unit tests)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # MEIOS_BUILD_TOOLS compiles the meios CLI; MEIOS_BUILD_TESTS is required
      # for the if(TARGET meios_cli) unit tests to register (they skip silently
      # in every no-TOOLS build).
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_TOOLS=ON `
            -DMEIOS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Focus operation adapter tests
        if: hashFiles('tests/unit/operation_adapter_test.cpp') != ''
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^operation_adapter\.' -C Release"
          $discovery = & ctest -N -R '^operation_adapter\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No operation adapter tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^operation_adapter\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^operation_adapter\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus CLI acquisition tests
        if: hashFiles('tests/unit/cli_acquisition_test.cpp') != ''
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^cli_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^cli_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No CLI acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^cli_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^cli_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60

  property-tests:
    runs-on: windows-2022
    name: property-tests (RapidCheck xacro_eval_prop)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # MEIOS_BUILD_PROPERTY_TESTS alone declares the RapidCheck fetch and the
      # xacro_eval_prop target (it does not need MEIOS_BUILD_TESTS).
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_PROPERTY_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60
