name: Windows

on:
  push:
    branches: [master, develop, 'milestone/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # The config-package resolves pugixml via find_dependency(pugixml 1.16);
      # vcpkg ships an older release, so build the pinned one.
      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_BUILD_TESTS=ON `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Focus text reader tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^text_reader\.' -C Release"
          $discovery = & ctest -N -R '^text_reader\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No text reader tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^text_reader\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^text_reader\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus operation failure tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^operation_failure\.' -C Release"
          $discovery = & ctest -N -R '^operation_failure\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No operation failure tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^operation_failure\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^operation_failure\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus YAML acquisition tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^yaml_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^yaml_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No YAML acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^yaml_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^yaml_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus source lookup tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^io_source_lookup\.' -C Release"
          $discovery = & ctest -N -R '^io_source_lookup\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No source lookup tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^io_source_lookup\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^io_source_lookup\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus load acquisition tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^load_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^load_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No load acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^load_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^load_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60

  install-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
            -DMEIOS_CMAKE_FETCH_DEPS=OFF

      - name: Build and install
        run: |
          cmake --build build --config Release
          cmake --install build --config Release

      - name: Build consumer
        run: |
          cmake tests/integration/consumer -B build-consumer -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps"
          cmake --build build-consumer --config Release

      - name: Run consumer test
        run: build-consumer/Release/integration_test.exe

      - name: Build and run the installed resource consumer
        run: |
          cmake examples/install_consumer -B build-resource-consumer -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/resource-consumer-install"
          cmake --build build-resource-consumer --config Release
          cmake --install build-resource-consumer --config Release
          & "${{ github.workspace }}/resource-consumer-install/bin/install_consumer.exe"

  enrichments:
    runs-on: windows-2022
    name: enrichments (scanners + archive-zip + ros)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_BUILD_TESTS=ON `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_SCAN_OBJ=ON `
            -DMEIOS_BUILD_SCAN_COLLADA=ON `
            -DMEIOS_BUILD_SCAN_STL=ON `
            -DMEIOS_BUILD_SCAN_GLTF=ON `
            -DMEIOS_BUILD_ARCHIVE_ZIP=ON `
            -DMEIOS_BUILD_ROS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Focus ROS source tests
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^ros_source\.' -C Release"
          $discovery = & ctest -N -R '^ros_source\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No ROS source tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^ros_source\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^ros_source\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60

  examples:
    runs-on: windows-2022
    name: examples (MEIOS_BUILD_EXAMPLES)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # The examples cell builds examples/ with all enrichments OFF: the flagship
      # (core+urdf only) must compile and every enrichment example must gate itself
      # out. All enrichments stay OFF.
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

  docs:
    runs-on: windows-2022
    name: docs (MEIOS_BUILD_DOCS compile-gate)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # The gate compiles the documented snippets against the build-tree
      # meios::urdf target with every enrichment OFF, so it exercises the core
      # consumer surface and FATALs at configure on a zero or malformed snippet.
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_DOCS=ON

      - name: Build
        run: cmake --build build --config Release --target doc_snippets

  tools:
    runs-on: windows-2022
    name: tools (MEIOS_BUILD_TOOLS + CLI unit tests)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # MEIOS_BUILD_TOOLS compiles the meios CLI; MEIOS_BUILD_TESTS is required
      # for the if(TARGET meios_cli) unit tests to register (they skip silently
      # in every no-TOOLS build).
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_TOOLS=ON `
            -DMEIOS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Focus operation adapter tests
        if: hashFiles('tests/unit/operation_adapter_test.cpp') != ''
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^operation_adapter\.' -C Release"
          $discovery = & ctest -N -R '^operation_adapter\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No operation adapter tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^operation_adapter\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^operation_adapter\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Focus CLI acquisition tests
        if: hashFiles('tests/unit/cli_acquisition_test.cpp') != ''
        working-directory: build
        shell: pwsh
        run: |
          Write-Host "ctest -N -R '^cli_acquisition\.' -C Release"
          $discovery = & ctest -N -R '^cli_acquisition\.' -C Release
          $discovery | ForEach-Object { Write-Host $_ }
          $count = @($discovery | Select-String -Pattern 'Test #[0-9]+:').Count
          Write-Host "Discovered tests: $count"
          if ($count -eq 0) { throw "No CLI acquisition tests discovered" }
          Write-Host "ctest --output-on-failure --no-tests=error -R '^cli_acquisition\.' -C Release --timeout 60"
          & ctest --output-on-failure --no-tests=error -R '^cli_acquisition\.' -C Release --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60

  property-tests:
    runs-on: windows-2022
    name: property-tests (RapidCheck xacro_eval_prop)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build --config Release
          cmake --install pugixml-build --config Release

      # MEIOS_BUILD_PROPERTY_TESTS alone declares the RapidCheck fetch and the
      # xacro_eval_prop target (it does not need MEIOS_BUILD_TESTS).
      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" `
            -DMEIOS_CMAKE_FETCH_DEPS=ON `
            -DMEIOS_WERROR=ON `
            -DMEIOS_BUILD_PROPERTY_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 60
