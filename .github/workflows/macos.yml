name: macOS

on:
  push:
    branches: [master, develop, 'milestone/**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    name: build (AppleClang)
    steps:
      - uses: actions/checkout@v4

      # The config-package resolves pugixml via find_dependency(pugixml 1.16);
      # brew ships an older release, so build the pinned one. This leg is also
      # the libc++ signal source for later phases.
      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  install-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      - name: Build and install
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
            -DMEIOS_CMAKE_FETCH_DEPS=OFF
          cmake --build build
          cmake --install build

      - name: Build consumer
        run: |
          cmake tests/integration/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install;${{ github.workspace }}/deps" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-consumer

      - name: Run consumer test
        run: ./build-consumer/integration_test

  enrichments:
    runs-on: macos-14
    name: enrichments (scanners + archive-zip + ros)
    steps:
      - uses: actions/checkout@v4

      - name: Install pugixml
        run: |
          git clone https://github.com/zeux/pugixml.git pugixml-src
          git -C pugixml-src checkout c8033ce9d039e7f9d134877c363397b3cfe20816
          cmake -S pugixml-src -B pugixml-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/deps"
          cmake --build pugixml-build
          cmake --install pugixml-build

      # The AppleClang/libc++ leg is the signal for float from_chars in the
      # scanner numeric-parsing paths, which historically lagged on libc++.
      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps" \
            -DMEIOS_WERROR=ON \
            -DMEIOS_BUILD_TESTS=ON \
            -DMEIOS_CMAKE_FETCH_DEPS=ON \
            -DMEIOS_BUILD_SCAN_OBJ=ON \
            -DMEIOS_BUILD_SCAN_COLLADA=ON \
            -DMEIOS_BUILD_SCAN_STL=ON \
            -DMEIOS_BUILD_SCAN_GLTF=ON \
            -DMEIOS_BUILD_ARCHIVE_ZIP=ON \
            -DMEIOS_BUILD_ROS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure
